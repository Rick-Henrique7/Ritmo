name: gestao_pessoal
description: >-
  Ritmo — Aplicativo pessoal de gestão de rotina com hábitos, tarefas,
  timer Pomodoro e estatísticas. Dois estilos: Editorial e Liquid Glass.
publish_to: 'none'

# Versionamento semântico: MAJOR.MINOR.PATCH+BUILD
# - Bump MAJOR em mudanças incompatíveis de API / breaking changes
# - Bump MINOR em features novas retrocompatíveis
# - Bump PATCH em bugfixes
# - BUILD incrementa a cada release publicado (Play Store, CI)
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gerenciamento de Estado
  flutter_riverpod: ^2.5.1

  # Roteamento
  go_router: ^14.0.0

  # Persistência Local (Offline First - AsyncStorage equivalent para Flutter)
  shared_preferences: ^2.2.3

  # Interface, Animações e Gráficos
  flutter_animate: ^4.5.0

  # Recursos Nativos e Utilitários
  wakelock_plus: ^1.2.0 # tela acesa durante o timer de foco
  flutter_local_notifications: ^19.4.0 # avisos locais (ADR 0009)
  timezone: ^0.10.0 # data do agendamento exigida pelo plugin
  intl: ^0.20.2

  # Audio (som de conclusão de tarefa)
  audioplayers: ^6.1.0

  # Liquid Glass 3D (iOS 26 design language) — shaders + jelly animations
  liquid_glass_widgets: ^1.4.4

  # Calendário premium
  syncfusion_flutter_calendar: ^28.1.36

  # Color picker premium
  flex_color_picker: ^3.6.0

  # UUIDs para IDs
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/success.mp3

  # Fontes embutidas: funcionam offline e sem nenhuma requisição de rede.
  # Jost (Editorial) — licença em assets/fonts/OFL.txt.
  # DM Sans (Liquid Glass) — licença em assets/fonts/OFL-DMSans.txt.
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-200-Thin.ttf
          weight: 200
        - asset: assets/fonts/Jost-300-Light.ttf
          weight: 300
        - asset: assets/fonts/Jost-400-Book.ttf
          weight: 400
        - asset: assets/fonts/Jost-500-Medium.ttf
          weight: 500
        - asset: assets/fonts/Jost-600-Semi.ttf
          weight: 600
        - asset: assets/fonts/Jost-700-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-300-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-400-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700-Bold.ttf
          weight: 700
