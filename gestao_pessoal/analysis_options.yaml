# Análise estática do Ritmo.
#
# Base: flutter_lints (recomendado pelo time do Flutter) + regras extras
# escolhidas para pegar bugs reais (futures esquecidas, chamadas dinâmicas)
# e manter o estilo consistente. Lints aparecem como "info"; o CI roda
# `flutter analyze --no-fatal-infos`, então só erros e avisos quebram o build.
# Ver docs/qualidade/testes.md.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - scripts/**

linter:
  rules:
    # Bugs prováveis
    - unawaited_futures          # Future sem await nem unawaited()
    - avoid_dynamic_calls        # chamada em `dynamic` escapa do tipo
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - no_adjacent_strings_in_list
    # Clareza
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - directives_ordering
    - use_super_parameters
    - avoid_redundant_argument_values
    - unnecessary_await_in_return
