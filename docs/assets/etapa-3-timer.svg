<title id="t">Timer de foco: contar tiques ou calcular pelo horário de término</title><desc id="d">Antes, o timer descontava um segundo a cada tique; em segundo plano os tiques param e o tempo atrasa. Agora ele guarda o horário de término e calcula o restante pelo relógio a cada tique.</desc>
