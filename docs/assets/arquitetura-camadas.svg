<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">Arquitetura em camadas do Ritmo</title><desc id="d">Presentation depende de Data, que depende de Domain. Data implementa as interfaces de repositório do Domain sobre SharedPreferences. Core oferece providers, serviços, tema e utilitários a todas as camadas.</desc>
<defs>
  <pattern id="zig" width="9" height="7" patternUnits="userSpaceOnUse">
    <path d="M0 4.5 L2.25 1.5 L4.5 4.5 L6.75 1.5 L9 4.5" fill="none" stroke="#2E2D2B" stroke-width="1" stroke-opacity=".6"/>
  </pattern>
</defs>
<style>
  text { font-family: Jost, Futura, 'Century Gothic', 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #2E2D2B; }
  .eyebrow { font-size: 15px; font-weight: 400; letter-spacing: .3px; }
  .title { font-size: 34px; font-weight: 300; }
  .h { font-size: 18px; font-weight: 500; }
  .s { font-size: 13.5px; fill: #6E685F; }
  .n { font-size: 15px; font-weight: 500; fill: #E4553F; }
  .on { fill: #F2EBE0; }
  .onm { fill: #B5AEA3; }
  .mono { font-family: Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
</style>
<rect width="1200" height="800" fill="#EDE5D8"/>
<circle cx="1210" cy="-10" r="160" fill="#E4553F"/><line x1="48" y1="40" x2="688" y2="40" stroke="#2E2D2B" stroke-opacity=".55"/>
<text x="48" y="67" class="eyebrow">Ritmo · engenharia</text>
<line x1="48" y1="80" x2="688" y2="80" stroke="#2E2D2B" stroke-opacity=".55"/>
<text x="48" y="114" class="eyebrow" style="font-weight:300;font-size:17px">Como o código se organiza</text>
<text x="48" y="150" class="title">Arquitetura em camadas</text>
<rect x="48" y="210" width="800" height="112" rx="26" fill="#F6F0E6" stroke="#D3C8B8"/><text x="78" y="252" class="h" style="font-size:22px;font-weight:400">Presentation</text><text x="78" y="278" class="s">telas e widgets — leem estado e disparam ações</text><text x="78" y="300" class="s mono" style="font-size:12px">dashboard_screen · habits_screen · tasks_screen</text><rect x="48" y="360" width="800" height="112" rx="26" fill="#F6F0E6" stroke="#D3C8B8"/><text x="78" y="402" class="h" style="font-size:22px;font-weight:400">Data</text><text x="78" y="428" class="s">controllers Riverpod + implementações dos repositórios</text><text x="78" y="450" class="s mono" style="font-size:12px">TasksNotifier · PrefsTasksRepository · stats_providers</text><rect x="48" y="510" width="800" height="112" rx="26" fill="#3B3A39" stroke="#3B3A39"/><text x="78" y="552" class="h on" style="font-size:22px;font-weight:400">Domain</text><text x="78" y="578" class="s onm">modelos, regras puras e contratos — sem I/O, sem Riverpod</text><text x="78" y="600" class="s onm mono" style="font-size:12px">TaskModel · TaskSchedule · HabitStreak · TasksRepository</text><line x1="448.0" y1="324" x2="448.0" y2="350" stroke="#2E2D2B" stroke-width="1.4"/><polygon points="7,0 -4.9,4.5 -4.9,-4.5" fill="#E4553F" transform="translate(448.0 353.0) rotate(90.0)"/><text x="462.0" y="344" class="s" style="font-size:12px">depende de</text><line x1="448.0" y1="474" x2="448.0" y2="500" stroke="#2E2D2B" stroke-width="1.4"/><polygon points="7,0 -4.9,4.5 -4.9,-4.5" fill="#E4553F" transform="translate(448.0 503.0) rotate(90.0)"/><text x="462.0" y="494" class="s" style="font-size:12px">depende de</text><rect x="518" y="680" width="330" height="66" rx="33" fill="none" stroke="#2E2D2B" stroke-dasharray="4 4"/><text x="683" y="719" text-anchor="middle" class="h" style="font-size:16px">SharedPreferences (JSON)</text><path d="M848 430 H866 V713 H856" fill="none" stroke="#2E2D2B" stroke-opacity=".6" stroke-dasharray="3 4"/><polygon points="6,0 -4.2,3.9 -4.2,-3.9" fill="#2E2D2B" transform="translate(854.0 713.0) rotate(180.0)"/><text x="658" y="660" class="s" style="font-size:12px">Prefs*Repository grava aqui</text><text x="78" y="660" class="s" style="font-size:12.5px">Data implementa as interfaces do Domain (inversão de dependência)</text><rect x="884" y="210" width="268" height="412" rx="26" fill="#E4553F"/><text x="912" y="254" style="font-size:22px;fill:#F6F0E6">Core</text><text x="912" y="294" style="font-size:14px;fill:#F6F0E6">providers de infraestrutura</text><text x="912" y="320" style="font-size:14px;fill:#F6F0E6">(armazenamento, hoje, relógio,</text><text x="912" y="346" style="font-size:14px;fill:#F6F0E6">vibração, som, tela acesa)</text><text x="912" y="372" style="font-size:14px;fill:#F6F0E6"></text><text x="912" y="398" style="font-size:14px;fill:#F6F0E6">tema e paleta por estilo</text><text x="912" y="424" style="font-size:14px;fill:#F6F0E6">widgets compartilhados</text><text x="912" y="450" style="font-size:14px;fill:#F6F0E6">utilitários de data e JSON</text><text x="912" y="580" style="font-size:12.5px;fill:#F6F0E6;opacity:.85">usado por todas as camadas;</text><text x="912" y="598" style="font-size:12.5px;fill:#F6F0E6;opacity:.85">não importa nenhuma feature</text></svg>
