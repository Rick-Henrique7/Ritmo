# Integração contínua do Ritmo.
# A cada push na main e em todo pull request: análise estática e testes.
# Ver docs/processo/ciclo-de-vida.md (fase "Verificar").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Analisar e testar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gestao_pessoal
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Formatação (só aviso)
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Há arquivos fora do padrão do dart format."

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      # Regras de dependência (docs/arquitetura.md, ADRs 0002 e 0008):
      # core não importa features, e domain não importa Riverpod nem
      # armazenamento (tipos de valor do Flutter, como Color, são aceitos).
      - name: Regras de arquitetura
        run: |
          set -e
          falhou=0
          if grep -rnE "import '.*features/" lib/core --include=*.dart; then
            echo "::error::lib/core não pode importar features/ (ADR 0008)."; falhou=1
          fi
          if grep -rnE "import 'package:(flutter_riverpod|shared_preferences)" lib/features/*/domain --include=*.dart; then
            echo "::error::domain/ deve ser puro (ADR 0004)."; falhou=1
          fi
          exit $falhou

      - name: Testes
        run: flutter test --coverage --reporter expanded

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: gestao_pessoal/coverage/lcov.info
          if-no-files-found: ignore
